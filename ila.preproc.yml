      <p style="margin-top: 20px;">
        <strong>Additional dedicated budgets for Retrieve and Aggregate endpoints:</strong>
      </p>

      <p style="margin-top: 10px;">
        The Retrieve and Aggregate endpoints have dedicated budgets that are checked <em>in addition to</em>
        the Query request budget shown above. A request to these endpoints must pass both budget checks.
      </p>

        <table >
          <thead>
            <tr>
              <th colspan="3" style="text-align: center; background-color: #e0e0e0; padding: 10px; font-weight: bold;">Retrieve request budget</th>
            </tr>
            <tr>
              <th></th>
              <th style="text-align: center;">Overall</th>
              <th style="text-align: center;">Per ID</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Requests per second: mutable streams</strong></td>
              <td style="text-align: center;">20</td>
