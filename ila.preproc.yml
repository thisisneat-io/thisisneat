            </tr>
          </tbody>
        </table>

      <p style="margin-top: 10px; font-style: italic; font-size: 0.9em;">
        Note: Retrieve endpoint requests are checked against both this budget and the Query request budget above.
      </p>

        <table >
          <thead>
            <tr>
              <th colspan="3" style="text-align: center; background-color: #e0e0e0; padding: 10px; font-weight: bold;">Aggregate request budget</th>
            </tr>
            <tr>
              <th></th>
              <th style="text-align: center;">Overall</th>
