      allOf:
        - $ref: '#/components/schemas/BasePropertyIla'

    AggregatesResultDefinitionIla:
      type: object
      title: aggregatesResultDictionary
      description: |
        A dictionary of the results for the requested aggregates mapped by the aggregates identifiers.

        <u>Example:</u>

        ```
        {
          "my_aggr_1": {
            "avg": 42
          },
          "my_aggr_2": {
            "max": 69
          },
        }
        ```
      uniqueItems: true
      additionalProperties:
        x-additionalPropertiesName: aggregate-id
        type: object
        title: aggregateResultDictionary
        description: |
          Requested aggregate result. It's the aggregate identifier from the request and a set of fields to represent aggregated data.
        oneOf:
          # metric aggregate responses
          - $ref: '#/components/schemas/AvgAggregateResultIla'
          - $ref: '#/components/schemas/CountAggregateResultIla'
          - $ref: '#/components/schemas/MinAggregateResultIla'
          - $ref: '#/components/schemas/MaxAggregateResultIla'
          - $ref: '#/components/schemas/SumAggregateResultIla'
          # bucket aggregate responses
          - $ref: '#/components/schemas/UniqueValuesAggregateResultIla'
          - $ref: '#/components/schemas/NumberHistogramAggregateResultIla'
          - $ref: '#/components/schemas/TimeHistogramAggregateResultIla'
          - $ref: '#/components/schemas/FiltersAggregateResultIla'
          # pipeline aggregate responses
          - $ref: '#/components/schemas/MovingFunctionAggregateResultIla'
      example:
        my_avg_aggregate1:
          avg: 42
        my_terms_aggregate2:
          uniqueValueBuckets:
            - value: Cognite
              count: 42
              aggregates:
                my_sub_aggregate1:
                  min: 13
                my_sub_aggregate2:
                  max: 69
                my_sub_aggregate3:
                  uniqueValueBuckets:
                    - value: us1
                      count: 42
                    - value: ie1
                      count: 7
            - value: 'AkerBP'
              count: 21
              aggregates:
                my_sub_aggregate1:
                  min: 99
                my_sub_aggregate2:
                  max: 999
                my_sub_aggregate3:
                  uniqueValueBuckets:
                    - value: us1
                      count: 11
    MovingFunctionAggregateResultIla:
      type: object
      title: movingFunctionResult
      required: [fnValue]
      properties:
        fnValue:
          type: number
          description: |
            The moving function value from the parent histogram aggregate buckets data
            located by the specified in the request buckets path.
          example: 42.7
    AvgAggregateResultIla:
      type: object
      title: avgResult
      required: [avg]
      properties:
        avg:
          type: number
          description: |
            The average value from the data stored by the specified in the request property.
          example: 42.7
    CountAggregateResultIla:
      type: object
      title: countResult
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          description: |
            The number of non-null values for specified in the request property.
          example: 42
    MinAggregateResultIla:
      type: object
      title: minResult
      required: [min]
      properties:
        min:
          type: number
          description: |
            The lowest - min - value for the specified in the request property.
          example: 13.42
    MaxAggregateResultIla:
      type: object
      title: maxResult
      required: [max]
      properties:
        max:
          type: number
          description: |
            The highest - max - value for the specified in the request property.
          example: 77.7
    SumAggregateResultIla:
      type: object
      title: sumResult
      required: [sum]
      properties:
        sum:
          type: number
          description: |
            The sum from the values of the specified in the request property.
          example: 777
    FiltersAggregateResultIla:
      type: object
      title: filtersResult
      properties:
        filterBuckets:
          type: array
          description: |
            Filter buckets of the specified in the request filters.
          items:
            type: object
            required: [count]
            properties:
              count:
                type: integer
                format: int64
                description: |
                  The count of items matching the filter for the bucket.
                example: 42
              aggregates:
                allOf:
                  - $ref: '#/components/schemas/AggregatesResultDefinitionIla'
    UniqueValuesAggregateResultIla:
      type: object
      title: uniqueValuesResult
      properties:
        uniqueValueBuckets:
          type: array
          description: |
            Unique value buckets on of the specified in the request property.
          items:
            type: object
            required: [count, value]
            properties:
              count:
                type: integer
                format: int64
                description: |
                  The count of items with the value in the property.
                example: 42
              value:
                title: aggregateValue
                allOf:
                  - $ref: 'datamodels.preproc.yml#/components/schemas/AggregateValue'
              aggregates:
                allOf:
                  - $ref: '#/components/schemas/AggregatesResultDefinitionIla'
    NumberHistogramAggregateResultIla:
      type: object
      title: numberHistogramResult
      properties:
        numberHistogramBuckets:
          type: array
          description: |
            The histogram from the values of the specified in the request property.
          items:
            type: object
            required: [count, intervalStart]
            properties:
              count:
                type: integer
                format: int64
                description: |
                  The count of items with the value from the bucket interval in the property.
                example: 100
              intervalStart:
                type: number
                description: |
                  The number which represents the start of the bucket interval (the next bucket start point is the end point for this bucket).
                example: 42.7
              aggregates:
                allOf:
                  - $ref: '#/components/schemas/AggregatesResultDefinitionIla'
    TimeHistogramAggregateResultIla:
      type: object
      title: timeHistogramResult
      properties:
        timeHistogramBuckets:
          type: array
          description: |
            The histogram from the values of the specified in the request property.
          items:
            type: object
            required: [count, intervalStart]
            properties:
              count:
                type: integer
                format: int64
                description: |
                  The count of items with the value from the bucket interval in the property.
                example: 100
              intervalStart:
                type: string
                description: |
                  The time point which represent the start of the bucket interval (the next bucket start point is the end point for this bucket).
                example: 2024-05-16T00:00:00Z
              aggregates:
                allOf:
                  - $ref: '#/components/schemas/AggregatesResultDefinitionIla'

    Record:
      type: object
      title: recordItem
      description: |
        Record item.
      required: [space, externalId, createdTime, lastUpdatedTime, properties]
      properties:
        space:
          allOf:
            - $ref: '#/components/schemas/RecordSpace'
        externalId:
          allOf:
            - $ref: 'datamodels.preproc.yml#/components/schemas/RecordExternalId'
        createdTime:
          title: createdTime
          example: 1720616232
          allOf:
            - $ref: 'shared.preproc.yml#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          title: lastUpdatedTime
          example: 1720616232
          allOf:
            - $ref: 'shared.preproc.yml#/components/schemas/EpochTimestamp'
        properties:
          type: object
          title: spaceToContainers
          description: |
            Spaces to containers to properties and their values for the requested containers.
          uniqueItems: true
          additionalProperties:
            x-additionalPropertiesName: space-name
            allOf:
              - $ref: '#/components/schemas/ContainerWithData'

    SyncRecord:
      type: object
      title: syncRecordItem
      description: |
        Sync record item.
      required: [space, externalId, createdTime, lastUpdatedTime, status]
      properties:
        space:
          allOf:
            - $ref: '#/components/schemas/RecordSpace'
        externalId:
          allOf:
            - $ref: 'datamodels.preproc.yml#/components/schemas/RecordExternalId'
        createdTime:
          title: createdTime
          example: 1720616232
          allOf:
            - $ref: 'shared.preproc.yml#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          title: lastUpdatedTime
          example: 1720616232
          allOf:
            - $ref: 'shared.preproc.yml#/components/schemas/EpochTimestamp'
        properties:
          type: object
          title: spaceToContainers
          description: |
            Spaces to containers to properties and their values for the requested containers.
            **Note:** The attribute is omitted for deleted records in mutable streams.
          uniqueItems: true
          additionalProperties:
            x-additionalPropertiesName: space-name
            allOf:
              - $ref: '#/components/schemas/ContainerWithData'
        status:
          type: string
          description: |
            The attribute represents the current record status.
          enum:
            - created
            - updated
            - deleted

    ContainerWithData:
      type: object
      title: containerToProperties
      description: |
        Container holding properties.
      uniqueItems: true
      additionalProperties:
        description: |
          Properties in the container of the ```record```.
        x-additionalPropertiesName: container-identifier
        title: propertyToValues
        allOf:
          - $ref: 'datamodels.preproc.yml#/components/schemas/PropertyValueGroupV3'
